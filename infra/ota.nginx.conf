server {
    listen 80;
    listen [::]:80;
    server_name ota.prostacks.net;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ota-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ota.prostacks.net;
    ssl_certificate /etc/letsencrypt/live/ota.prostacks.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ota.prostacks.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ota.access.log;
    error_log /var/log/nginx/ota.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";

    location = /health {
        proxy_pass http://127.0.0.1:3007;
    }
    location = /hot-updater {
        proxy_pass http://127.0.0.1:3007;
    }
    location ^~ /hot-updater/ {
        proxy_pass http://127.0.0.1:3007;
    }
    location / {
        auth_basic "Hot Updater lab";
        auth_basic_user_file /etc/nginx/ota-lab.htpasswd;
        proxy_pass http://127.0.0.1:1422;
        proxy_http_version 1.1;
    }
}
