name: RN demo OTA deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to publish; both updates Android and iOS'
        type: choice
        options: [both, android, ios]
        default: both
  push:
    branches: [main]
    paths:
      - 'apps/ota-demo/App.tsx'
      - 'apps/ota-demo/src/**'
      - 'apps/ota-demo/index.js'
      - 'apps/ota-demo/assets/**'
      - 'apps/ota-demo/hot-updater.config.ts'
      - '.github/workflows/rn-demo-ota.yml'

permissions:
  contents: read
  id-token: write

# S3 metadata is shared with the original diagnostic fixture workflow.
concurrency:
  group: ota-lab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ota-demo
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      OTA_PLATFORM: ${{ inputs.platform || 'both' }}
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ota-demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: rn-demo-${{ github.run_id }}
      # Publish sequentially because both platforms share S3 metadata.
      - name: Publish Android OTA
        if: ${{ env.OTA_PLATFORM == 'both' || env.OTA_PLATFORM == 'android' }}
        run: npx hot-updater deploy -p android -c rn-demo -t 1.0.0 -m "RN demo $DEPLOY_COMMIT" -o dist
      - name: Publish iOS OTA
        if: ${{ env.OTA_PLATFORM == 'both' || env.OTA_PLATFORM == 'ios' }}
        run: npx hot-updater deploy -p ios -c rn-demo -t 1.0.0 -m "RN demo $DEPLOY_COMMIT" -o dist
